name: ARMv7 compatibility build

on:
  pull_request:
    branches: [master]
  push:
    branches: [support/redmi-9-active-armv7]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  armv7-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Termux APK and both ARM bridges
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleTermuxDebug
          file app/src/main/assets/bin/agy_ide_bridge-arm64
          file app/src/main/assets/bin/agy_ide_bridge-armv7
          test -s app/src/main/assets/bin/agy_ide_bridge-arm64
          test -s app/src/main/assets/bin/agy_ide_bridge-armv7
          find app/build/outputs/apk/termux/debug -name '*.apk' -print -quit | grep -q .
