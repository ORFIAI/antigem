name: ARMv7 compatibility build

on:
  pull_request:
    branches: [master]
  push:
    branches: [support/redmi-9-active-armv7]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  armv7-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: agy_ide_bridge/go.sum

      - name: Set up Android SDK and install ARMv7 NDK
        uses: android-actions/setup-android@v3
        with:
          # Do not use the action's default "tools" package: Google removed it.
          # Install only current packages needed for this build.
          packages: platform-tools ndk;27.2.12479018

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Termux APK and both ARM bridges
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache :app:assembleTermuxDebug
          file app/src/main/assets/bin/agy_ide_bridge-arm64
          file app/src/main/assets/bin/agy_ide_bridge-armv7
          test -s app/src/main/assets/bin/agy_ide_bridge-arm64
          test -s app/src/main/assets/bin/agy_ide_bridge-armv7
          find app/build/outputs/apk/termux/debug -name '*.apk' -print -quit | grep -q .

      - name: Upload ARMv7 debug APK and bridge binaries
        uses: actions/upload-artifact@v4
        with:
          name: antigem-termux-armv7-debug
          path: |
            app/build/outputs/apk/termux/debug/*.apk
            app/src/main/assets/bin/agy_ide_bridge-armv7
            app/src/main/assets/bin/agy_ide_bridge-arm64
          if-no-files-found: error
          retention-days: 14
