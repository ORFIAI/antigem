name: ARMv7 compatibility build

on:
  pull_request:
    branches: [master]
  push:
    branches: [support/redmi-9-active-armv7]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  armv7-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: agy_ide_bridge/go.sum

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          test -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" --version

      - name: Install Android NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Termux APK and both ARM bridges
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache :app:assembleTermuxDebug
          file app/src/main/assets/bin/agy_ide_bridge-arm64
          file app/src/main/assets/bin/agy_ide_bridge-armv7
          test -s app/src/main/assets/bin/agy_ide_bridge-arm64
          test -s app/src/main/assets/bin/agy_ide_bridge-armv7
          find app/build/outputs/apk/termux/debug -name '*.apk' -print -quit | grep -q .
